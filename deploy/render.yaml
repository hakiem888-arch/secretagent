services:
  - type: worker
    name: coinagentx-v605-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 worker.py --interval 60 --monitor-interval 10 --heartbeat-interval 30 --candidates 20 --shortlist-limit 50 --max-groq-candidates 5
    envVars:
      - key: COINAGENT_REQUIRE_POSTGRES
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: STRATEGY_PROFILE
        value: "BALANCED"
